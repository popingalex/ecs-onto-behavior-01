<!doctype html>
<html>
<head><meta charset="utf-8"><title>W5 StrictMode 隔离宿主</title></head>
<body>
<div id="errors">errors: (none)</div>
<div id="root"></div>
<script>
  // 把运行时错误写进 DOM，便于无控制台环境下取证。
  window.addEventListener("error", (e) => {
    document.getElementById("errors").textContent =
      "errors: " + (e.error?.stack ?? e.message)
  })
  window.addEventListener("unhandledrejection", (e) => {
    document.getElementById("errors").textContent =
      "errors: unhandledrejection: " + (e.reason?.stack ?? e.reason)
  })
</script>
<script type="module" src="/main.tsx"></script>
</body>
</html>
